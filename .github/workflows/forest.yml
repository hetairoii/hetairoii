name: Commit forest

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/forest.mjs'
      - '.github/workflows/forest.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Render forest
        run: node scripts/forest.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.FOREST_TOKEN || github.token }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/macaw-forest.svg
          git diff --staged --quiet || (git commit -m "chore: update commit forest" && git push)
